name: Emscripten

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '.github/workflows/*'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ./build-web/_deps
          key: build-emscripten-deps

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: |
          emcc --version
          cmake --version

      - name: Configure (CMake)
        run: |
          mkdir -p build-web
          cd build-web
          emcmake cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_TEST=OFF \
            ..

      - name: Build
        run: |
          cd build-web
          cmake --build . --config Release

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          
          # 1. Copy all Emscripten generated files (.js, .wasm, .data, .html)
          cp build-web/minigin_web.* dist/
          
          # 2. Copy EVERYTHING from your custom web folder (CSS, icons, etc.), not just HTML
          if [ -d "web" ]; then cp -r web/* dist/; fi
          
          # 3. Rename the generated minigin_web.html to index.html so GitHub Pages can serve it
          if [ ! -f "dist/index.html" ] && [ -f "dist/minigin_web.html" ]; then
            mv dist/minigin_web.html dist/index.html
          fi
          
          # 4. Add .nojekyll to ensure GitHub Pages doesn't block files with underscores
          touch dist/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
